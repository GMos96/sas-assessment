spring.application.name=sas-assessment

# Encryption keys (provide as Base64 via env in dev/test)
app.encryption.aes256.key=${ENCRYPTION_KEY_BASE64:q1vZ3s8nR6yT9mF2bH0pLx4cV7uYkN5oQwEeR3tBzA9}
app.encryption.hmac.key=${ENCRYPTION_HMAC_KEY_BASE64:m2Xy8pQw4rT1bN6vC5uZ9sL0kH3jF7gYdV8aB2cEwQ}
app.encryption.key-id=${ENCRYPTION_KEY_ID:dev-key}

# Example datasource (override with env vars or set up local Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Flyway will run migrations from src/main/resources/db/migration by default

# Swagger/OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

