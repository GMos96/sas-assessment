# Test Profile Configuration for Integration Tests
# Used by tests annotated with @ActiveProfiles("test")

spring.application.name=sas-assessment-test

# Encryption keys for testing (never use these in production!)
app.encryption.aes256.key=dGVzdC1hZXMyNTYta2V5LTMyLWJ5dGVzLWxvbmcxMjM0NTY3OA==
app.encryption.hmac.key=dGVzdC1obWFjLWtleS1mb3ItdGVzdGluZy1wdXJwb3Nlcw==
app.encryption.key-id=test-key-id

# Datasource configuration (overridden by TestContainers @ServiceConnection)
# These are fallback values if TestContainers fails
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=testuser
spring.datasource.password=testpass

# Flyway will run migrations automatically
spring.flyway.enabled=true

# Disable Spring Boot Docker Compose in tests
spring.docker.compose.enabled=false

# Disable OpenTelemetry in tests for faster execution
management.tracing.enabled=false

# Log SQL for debugging (can be disabled for cleaner test output)
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.flywaydb=INFO
logging.level.com.example.sas=DEBUG
logging.level.org.testcontainers=DEBUG
logging.level.com.github.dockerjava=DEBUG

# Swagger/OpenAPI disabled in tests (not needed)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

